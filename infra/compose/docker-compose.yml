services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
  odoo:
    image: odoo:17
    depends_on: [db]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports: ["8069:8069"]
    volumes: [odoo-data:/var/lib/odoo]
volumes:
  db-data:
  odoo-data:
